<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reel – Movie search</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="/static/style.css">
</head>
<body>

  <header class="hero">
    <div class="hero-inner">
      <h1 id="page-title">What are we watching tonight?</h1>

      <div class="search-box" id="search-box">
        <input
          type="text"
          id="search-input"
          placeholder="Try Interstellar, Parasite or Spirited Away"
          aria-label="Movie title"
          autocomplete="off"
        >
        <button type="button" id="search-btn">Search</button>
      </div>
    </div>
  </header>

  <main class="results">
    <!-- Optional: use this for "Loading...", "No movie found", errors, etc. -->
    <p id="status-message"></p>

    <!-- Your JS will fill this div with movie-div blocks -->
    <div id="movies-container">

      <!--
        HOW IT WORKS
        - Every .movie-div starts collapsed: it shows only poster, title, type and year.
        - Add the class "expanded" to a .movie-div (on click, in your JS) to reveal
          genre, plot and the IMDb rating. Remove the class to collapse it again.
        - Delete the two samples below once your JS builds the cards.
      -->

      <!-- ===== Sample 1: collapsed (default state) ===== -->
      <article class="movie-div" tabindex="0">
        <div class="movie-poster-wrap">
          <img
            class="movie-poster"
            src="data:image/gif;base64,R0lGODlhAQABAAAAACH5BAEKAAEALAAAAAABAAEAAAICTAEAOw=="
            alt="Poster for Parasite"
          >
        </div>

        <div class="movie-main">
          <h2 class="movie-title">Parasite</h2>

          <div class="movie-meta">
            <span class="movie-type">movie</span>
            <span class="movie-year">2019</span>
          </div>

          <!-- Hidden until .expanded is added -->
          <div class="movie-details">
            <p class="movie-genre">Comedy, Drama, Thriller</p>
            <p class="movie-plot">
              A poor family slowly worms its way into the household of a wealthy one,
              until a hidden secret threatens to unravel everything.
            </p>
          </div>
        </div>

        <!-- Hidden until .expanded is added -->
        <div class="movie-stub">
          <span class="stub-label">IMDb</span>
          <span class="movie-rating">8.5</span>
          <span class="stub-scale">out of 10</span>
        </div>
      </article>

      

    </div>
  </main>
<script src="/static/script.js"></script>
</body>
</html>
